<?xml version="1.0" encoding="utf-8"?>
<!-- KIPLAN IP favicon — matches the in-app wordmark aesthetic: amber diamond + inner circle, on transparent background. Part of the KIPLAN brand family (Scholar / Law / Notary / IP). -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
     viewBox="0 0 32 32" style="enable-background:new 0 0 32 32;" xml:space="preserve">
  <defs>
    <style type="text/css">
      .kip-mark { fill: none; stroke: #B8763E; stroke-width: 1.6; stroke-miterlimit: 10; }
      .kip-core { fill: #B8763E; }
      .kip-ink  { fill: #1A1815; }
    </style>
  </defs>

  <!-- Square rounded background in deep ink (transparent-friendly: only renders on light surfaces) -->
  <rect class="kip-ink" x="2" y="2" width="28" height="28" rx="6" ry="6" fill="#1A1815"/>

  <!-- Amber diamond (rotated square) — matches the in-app wordmark motif -->
  <rect class="kip-mark" x="9.5" y="9.5" width="13" height="13" transform="rotate(45 16 16)"/>

  <!-- Inner core circle in amber -->
  <circle class="kip-core" cx="16" cy="16" r="2.6"/>
</svg>
